name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1"
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  analysis:
    if: github.event.repository.private == false
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: results.sarif

  private-repo-note:
    if: github.event.repository.private == true
    name: Scorecard skipped for private repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip condition
        run: |
          echo "Scorecard full analysis requires public repository access patterns."
          echo "This repository is private, so Scorecard is intentionally skipped until the repo is public."
