version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      npm-non-breaking:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned at 7.0.1 in package.json. 7.1.x introduces stricter
      # set-state-in-effect / purity rules that flag 14 existing call
      # sites; bumping needs its own dedicated PR with those fixes, not
      # a group sweep. Without this entry Dependabot re-proposes the
      # bump every Monday via the npm-non-breaking group.
      - dependency-name: "eslint-plugin-react-hooks"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions-bundle:
        patterns:
          - "*"
